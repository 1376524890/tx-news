# Input: Python 打包元数据与工具配置
# Output: setuptools 构建配置与 ruff 规则
# Pos: 项目工具入口（变更时同步更新以上注释与所属目录 FOLDER.md）

[project]
name = "tx-news"
version = "0.1.0"
description = "High-timeliness economic news ingestion and analysis system (single-node v0)."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
