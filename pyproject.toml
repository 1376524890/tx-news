[project]
name = "tx-news"
version = "0.1.0"
description = "High-timeliness economic news ingestion and analysis system (single-node v0)."
readme = "README.md"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
