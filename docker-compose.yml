# Input: 本地 Docker 环境与镜像拉取权限
# Output: Postgres/Redis/NATS/MinIO/Qdrant 的本地编排
# Pos: 本地基础设施定义（变更时同步更新以上注释与所属目录 FOLDER.md）

services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_DB: txnews
      POSTGRES_USER: txnews
      POSTGRES_PASSWORD: txnews
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  redis:
    image: redis:7
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data

  nats:
    image: nats:2.10
    command: ["-js", "-m", "8222"]
    ports:
      - "4222:4222"
      - "8222:8222"

  minio:
    image: minio/minio:RELEASE.2024-07-15T19-02-30Z
    command: ["server", "/data", "--console-address", ":9001"]
    environment:
      MINIO_ROOT_USER: txnews
      MINIO_ROOT_PASSWORD: txnewssecret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  qdrant:
    image: qdrant/qdrant:v1.11.3
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage

volumes:
  postgres_data:
  redis_data:
  minio_data:
  qdrant_data:
