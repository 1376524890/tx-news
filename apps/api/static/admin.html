<!doctype html>
<!-- Input: 浏览器加载静态页面与 /static 资源 -->
<!-- Output: 管理台 UI 骨架（挂载 admin.js；含实时监控与日志视图） -->
<!-- Pos: 管理台入口页面（变更时同步更新以上注释与所属目录 FOLDER.md） -->
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TX-News 管理台</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="brand-title">TX-News 管理台</div>
        <div class="brand-subtitle">模块健康 · 抓取/分析吞吐 · 日志</div>
      </div>
      <div class="panel-actions">
        <a class="btn btn-ghost" href="/">返回对话</a>
        <button class="btn btn-ghost" id="btnRefresh">刷新</button>
      </div>
    </header>

    <main class="layout" style="grid-template-columns: 1fr 1fr">
      <section class="panel" style="grid-column: 1 / -1">
        <div class="panel-header">
          <div class="panel-title">实时监控</div>
          <div class="panel-actions">
            <span class="badge" id="rtStatus">-</span>
          </div>
        </div>
        <div class="side-body">
          <div class="grid-metrics" id="rtMetrics"></div>
          <div class="flow" id="rtFlow"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">依赖健康</div>
        </div>
        <div class="side-body">
          <div class="list" id="deps"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">进程状态</div>
        </div>
        <div class="side-body">
          <div class="list" id="procs"></div>
        </div>
      </section>

      <section class="panel" style="grid-column: 1 / -1">
        <div class="panel-header">
          <div class="panel-title">抓取/分析进度</div>
          <div class="panel-actions">
            <select class="input" id="window" style="width: 180px; min-height: 40px">
              <option value="30">近 30 分钟</option>
              <option value="60" selected>近 60 分钟</option>
              <option value="180">近 180 分钟</option>
              <option value="1440">近 24 小时</option>
            </select>
          </div>
        </div>
        <div class="side-body">
          <div class="kv">
            <div class="k">raw_documents</div>
            <div class="v" id="mRaw">-</div>
            <div class="k">article_versions</div>
            <div class="v" id="mVer">-</div>
            <div class="k">analyses</div>
            <div class="v" id="mAna">-</div>
            <div class="k">lag(s)</div>
            <div class="v" id="mLag">-</div>
          </div>
          <div class="list" id="latest"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">A股主数据缓存（Tushare/AkShare）</div>
        </div>
        <div class="side-body">
          <div class="list" id="tushare"></div>
        </div>
      </section>

      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">日志（tail）</div>
          <div class="panel-actions">
            <label class="toggle">
              <input type="checkbox" id="logFollow" checked />
              <span>跟随</span>
            </label>
            <label class="toggle">
              <input type="checkbox" id="logWrap" checked />
              <span>换行</span>
            </label>
            <select class="input" id="logLevel" style="width: 120px; min-height: 40px">
              <option value="ALL" selected>ALL</option>
              <option value="ERROR">ERROR</option>
              <option value="WARNING">WARNING</option>
              <option value="INFO">INFO</option>
              <option value="DEBUG">DEBUG</option>
            </select>
            <input class="input" id="logSearch" placeholder="搜索…" style="width: 160px; min-height: 40px" />
            <select class="input" id="logName" style="width: 190px; min-height: 40px">
              <option value="api">api</option>
              <option value="collector">collector</option>
              <option value="nats_bridge">nats_bridge</option>
              <option value="celery_worker">celery_worker</option>
              <option value="bootstrap">bootstrap</option>
            </select>
          </div>
        </div>
        <div class="side-body">
          <div id="logTail" class="log-view"></div>
        </div>
      </section>
    </main>

    <script src="/static/admin.js"></script>
  </body>
</html>
