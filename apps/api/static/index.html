<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TX-News</title>
    <link rel="stylesheet" href="/static/style.css" />
  </head>
  <body>
    <header class="header">
      <div class="brand">
        <div class="brand-title">TX-News</div>
        <div class="brand-subtitle">高时效性经济新闻 · 采集/去重/分析 · A股</div>
      </div>
      <div class="status" id="status">
        <span class="dot dot-warn" id="statusDot"></span>
        <span class="status-text" id="statusText">连接中…</span>
      </div>
      <div class="panel-actions">
        <a class="btn btn-ghost" href="/admin">管理台</a>
      </div>
    </header>

    <main class="layout">
      <section class="panel">
        <div class="panel-header">
          <div class="panel-title">对话</div>
          <div class="panel-actions">
            <button class="btn btn-ghost" id="btnClear">清空</button>
          </div>
        </div>

        <div class="chat" id="chat"></div>

        <form class="composer" id="composer">
          <textarea
            id="input"
            class="input"
            rows="2"
            placeholder="输入你的问题（例如：今天有哪些影响A股的突发？某某公司发生了什么？）"
            required
          ></textarea>
          <div class="composer-row">
            <div class="hint">
              不展示新闻全文；回答基于数据库与知识库检索结果。
            </div>
            <button class="btn" type="submit" id="btnSend">发送</button>
          </div>
        </form>
      </section>

      <aside class="panel side">
        <div class="panel-header">
          <div class="panel-title">最新信号</div>
          <div class="panel-actions">
            <button class="btn btn-ghost" id="btnRefresh">刷新</button>
          </div>
        </div>
        <div class="side-body">
          <div class="kv">
            <div class="k">articles</div>
            <div class="v" id="countArticles">-</div>
            <div class="k">analyses</div>
            <div class="v" id="countAnalyses">-</div>
            <div class="k">signals</div>
            <div class="v" id="countSignals">-</div>
            <div class="k">a_share</div>
            <div class="v" id="countAShare">-</div>
          </div>
          <div class="list" id="signals"></div>
        </div>
      </aside>
    </main>

    <script src="/static/app.js"></script>
  </body>
</html>
