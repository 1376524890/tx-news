# Input: 本地运行参数（crawler/retention/embedding/llm/tushare 等）
# Output: 供 tx_news.settings.FileSettings 加载的 YAML 配置
# Pos: 主配置文件（变更时同步更新以上注释与所属目录 FOLDER.md）

# v0 固定配置（单机起步）

crawler:
  # 单机全局并发上限
  max_concurrency: 1
  # 基础超时（秒）
  request_timeout_seconds: 20
  # 重试次数（仅对 5xx/超时/网络抖动等可恢复错误）
  max_retries: 3
  # 按域名限速（秒）；为 0 表示不额外 sleep，仅靠 max_concurrency 控制
  per_domain_min_interval_seconds: 0

retention:
  # raw 全文与快照保留天数（超过后按 TTL 清理）
  raw_days: 7

embedding:
  # 4090/3090 等 GPU：建议使用更大模型 + FP16；无 GPU 时 `device: auto` 会自动回落到 CPU。
  # 备选：`BAAI/bge-m3`（更强/更大，初次下载更慢）
  model_name: BAAI/bge-large-zh-v1.5
  # auto / cpu / cuda / cuda:0（多卡可用 CUDA_VISIBLE_DEVICES 控制进程绑定）
  # 建议通过 `.env` 设置 `TXNEWS_ACCELERATOR` / `TXNEWS_EMBEDDING_DEVICE` 控制 CPU/GPU
  device: cpu
  # GPU 上建议 true；CPU 上无影响
  use_fp16: true
  # 可选：指定 HuggingFace cache 目录（也可直接把 model_name 写成本地模型目录）
  # cache_dir: var/hf_cache
  # Qdrant collection 策略：auto(兼容旧库) / base(强制单 collection) / scoped(按模型+维度隔离)
  qdrant_collection_strategy: auto

llm:
  # chat：API/UI 对话（保持云服务）
  chat:
    provider: dashscope
    model: qwen3-max
    # base_url: https://dashscope.aliyuncs.com/compatible-mode/v1
    # DashScope API Key 建议通过环境变量注入；若必须写配置文件，可放在这里
    # api_key: ""
    timeout_seconds: 60

  # deep：worker 深分析（推荐：本地 vLLM 微调模型）
  deep:
    provider: openai_compat
    base_url: http://127.0.0.1:9999/v1
    model: deepseekr1-merged
    # 本地 vLLM 通常不需要 key；如你在网关上开启鉴权，可在此配置
    # api_key: "local"
    timeout_seconds: 120

  max_concurrency: 2

tushare:
  # Tushare token（必填；用于拉取 A 股主数据）
  token: "cab8e22a8a441ce9d816359fa54b06dee2ccc1809bc4402197f71f4a"
  # 主数据缓存过期时间（小时）；未过期则直接使用本地缓存文件，避免频繁请求
  cache_ttl_hours: 12

# 事件归并窗口（按 event_type 动态配置；单位分钟）
# 说明：用于把新闻聚合为 event_id，并驱动 Event-Centric RAG 的时间线维护。
event_windows_minutes:
  policy: 1440
  macro_data: 1440
  company_event: 2880
  geopolitics: 4320
  industry_supply_demand: 4320
  liquidity: 1440
