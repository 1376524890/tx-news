# Input: 密钥（由部署者填写或接入外部 Secret 管理）
# Output: Secret(tx-news-secrets)（环境变量注入）
# Pos: Kubernetes 资源清单（变更时同步更新以上注释与所属目录 FOLDER.md）

apiVersion: v1
kind: Secret
metadata:
  name: tx-news-secrets
  namespace: tx-news
type: Opaque
stringData:
