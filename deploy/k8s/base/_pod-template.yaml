# Input: 参考模板（非 kustomize resources）
# Output: 可复用的 Pod 配置片段（envFrom + volumes）
# Pos: Kubernetes 参考模板（变更时同步更新以上注释与所属目录 FOLDER.md）

apiVersion: v1
kind: Pod
metadata:
  name: _template
spec:
  containers:
    - name: app
      envFrom:
        - configMapRef:
            name: tx-news-env
        - secretRef:
            name: tx-news-secrets
      volumeMounts:
        - name: config
          mountPath: /app/config
          readOnly: true
        - name: hf-cache
          mountPath: /app/var/hf
  volumes:
    - name: config
      configMap:
        name: tx-news-files
        items:
          - key: config.yaml
            path: config.yaml
          - key: sources.txt
            path: sources.txt
    - name: hf-cache
      persistentVolumeClaim:
        claimName: tx-news-hf-cache
